services:
  server:
    image: laodvx-server-auth
    ports:
      - "${DOCKER_IP:-127.0.0.1}:${DOCKER_SERVER_PORT:-3220}:${SERVER_PORT:-3220}"
      - "${DOCKER_DEV_IP:-127.0.0.1}:${DOCKER_SERVER_DEV_PORT:-3221}:${SERVER_DEV_PORT:-3221}"
    env_file:
      - .env
    volumes:
      # Persist auto-generated JWT season keys across container restarts.
      # Losing these would invalidate all live tokens for the current season.
      - ./keys:/app/keys
    restart: unless-stopped
    networks:
      - laodvx-auth-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-dx_auth}
    ports:
      - "${DOCKER_IP:-127.0.0.1}:${DOCKER_DB_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - laodvx-auth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dx_auth}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${DOCKER_IP:-127.0.0.1}:${DOCKER_REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    networks:
      - laodvx-auth-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  laodvx-auth-network:
    driver: bridge
